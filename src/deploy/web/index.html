<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripAI</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #171717;
      --muted: #858585;
      --line: #e7e7e7;
      --soft: #f7f7f7;
      --assistant: #f5f7fa;
      --user: #e9f3ff;
      --accent: #8fcaff;
      --accent-strong: #4aa3ff;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 32px 18px;
    }

    .conversation {
      width: min(820px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 28px 0 18px;
    }

    .conversation.has-messages {
      justify-content: flex-start;
      padding-bottom: 28px;
    }

    .welcome {
      text-align: center;
      margin: 0 0 28px;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
    }

    .welcome.hidden {
      display: none;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      width: fit-content;
      max-width: min(680px, 92%);
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.72;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid transparent;
    }

    .assistant .bubble {
      background: var(--assistant);
      border-color: var(--line);
    }

    .user .bubble {
      background: var(--user);
      color: #102033;
    }

    .composer-area {
      width: min(820px, 100%);
      margin: 0 auto;
      position: sticky;
      bottom: 0;
      padding: 12px 0 0;
      background: linear-gradient(180deg, rgba(255,255,255,0), #fff 26%);
    }

    .composer {
      min-height: 56px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 8px;
      padding: 7px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #3f3f3f;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 24px;
      line-height: 1;
    }

    .icon-button:hover {
      background: var(--soft);
    }

    .send {
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    .send:hover {
      background: var(--accent-strong);
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 28px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      line-height: 1.55;
      padding: 6px 4px;
      background: transparent;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .status {
      min-height: 24px;
      padding: 8px 16px 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .status.error {
      color: var(--danger);
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 12px;
      }

      .bubble {
        max-width: 96%;
      }

      .composer {
        grid-template-columns: 38px 1fr 38px;
        border-radius: 24px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="conversation" id="conversation" aria-live="polite">
      <h1 class="welcome" id="welcome">Ready when you are.</h1>
    </section>

    <section class="composer-area" aria-label="TripAI chat input">
      <form class="composer" id="chatForm">
        <button class="icon-button" type="button" id="newChatButton" title="New chat" aria-label="New chat">+</button>
        <textarea id="userInput" rows="1" placeholder="Ask anything"></textarea>
        <button class="icon-button send" type="submit" id="sendButton" title="Send" aria-label="Send">&#8593;</button>
      </form>
      <div class="status" id="statusText"></div>
    </section>
  </main>

  <script>
    const conversation = document.getElementById('conversation');
    const welcome = document.getElementById('welcome');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const newChatButton = document.getElementById('newChatButton');
    const statusText = document.getElementById('statusText');

    let messages = [];
    let isSending = false;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setStatus(text, isError = false) {
      statusText.textContent = text;
      statusText.classList.toggle('error', isError);
    }

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    }

    function setSending(value) {
      isSending = value;
      sendButton.disabled = value;
      input.disabled = value;
      if (value) setStatus('Thinking...');
    }

    function renderMessage(role, content) {
      welcome.classList.add('hidden');
      conversation.classList.add('has-messages');

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = escapeHtml(content);
      wrapper.appendChild(bubble);
      conversation.appendChild(wrapper);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return bubble;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || isSending) return;

      input.value = '';
      autoGrow();
      setStatus('');
      renderMessage('user', text);
      messages.push({ role: 'user', content: text });

      const assistantBubble = renderMessage('assistant', '...');
      setSending(true);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        const payloadText = await response.text();
        let payload;
        try {
          payload = JSON.parse(payloadText);
        } catch (error) {
          throw new Error(payloadText || 'Invalid JSON response');
        }
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        const answer = payload.final_answer || '';
        assistantBubble.innerHTML = escapeHtml(answer || '(empty response)');
        messages.push({ role: 'assistant', content: answer });
        setStatus('');
      } catch (error) {
        assistantBubble.innerHTML = escapeHtml(`请求失败：${error.message}`);
        setStatus('请求失败，请稍后重试。', true);
      } finally {
        setSending(false);
        input.focus();
      }
    }

    function startNewChat() {
      messages = [];
      conversation.querySelectorAll('.message').forEach((node) => node.remove());
      welcome.classList.remove('hidden');
      conversation.classList.remove('has-messages');
      setStatus('');
      input.focus();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    newChatButton.addEventListener('click', startNewChat);

    autoGrow();
    input.focus();
  </script>
</body>
</html>
